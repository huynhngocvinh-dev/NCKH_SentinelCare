spring.application.name=SentinelCare

# Cấu hình kết nối MySQL Aiven Cloud
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Redis Docker Local
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# TẮT SSL KHI DÙNG REDIS DOCKER LOCAL 
spring.data.redis.ssl.enabled=false

# Cấu hình Gửi Email qua Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cấu hình JWT Secret Key
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Google AI Studio / Cloud TTS API Key
google.ai.studio.api-key=${GOOGLE_AI_KEY}

# Stringee API Credentials
stringee.key.sid=${STRINGEE_KEY_SID}
stringee.key.secret=${STRINGEE_KEY_SECRET}
stringee.from.number=${STRINGEE_FROM_NUMBER}

# Bắt Jackson bỏ qua lỗi Proxy rỗng của Hibernate
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Khóa bí mật cho camera AI / vòng đeo IoT gọi vào
sentinel.device-api-key=${DEVICE_API_KEY:}

# Địa chỉ công khai của backend, dùng trong link email
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Origin của frontend được phép gọi API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cookie phiên đăng nhập (JWT)
app.auth.cookie-name=sentinel_access_token
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}



# ===== Thanh toán & gói dịch vụ =====
# Tiền tố mã giao dịch gửi VNPAY. Mã không được trùng: nếu xóa CSDL làm lại thì đổi tiền tố (vd SC2)
payment.order-prefix=${PAYMENT_ORDER_PREFIX:SC}
# Số tiền tối thiểu mỗi giao dịch (VNĐ)
payment.min-charge=5000

# VNPAY PAY (sandbox)
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.expire-minutes=15

# Chính sách gia hạn
billing.grace-days=3
billing.reminder-days=3
# Nhắc gia hạn lại sau mỗi bấy nhiêu giờ trong thời gian ân hạn
billing.notice-hours=24
# Cho phép gia hạn sớm khi còn không quá bấy nhiêu ngày
billing.renew-window-days=7
billing.entitlement-slack-hours=24
billing.pending-invoice-timeout-minutes=30
# Lịch job (giờ Việt Nam): xử lý đến hạn mỗi giờ, nhắc gia hạn 09:00, dọn hóa đơn bỏ dở mỗi 15 phút
billing.cron.renewal=0 0 * * * *
billing.cron.reminder=0 0 9 * * *
billing.cron.pending-invoices=0 */15 * * * *
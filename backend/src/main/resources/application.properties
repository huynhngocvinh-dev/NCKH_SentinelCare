spring.application.name=SentinelCare

# Cấu hình kết nối MySQL Aiven Cloud
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Redis Docker Local
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# TẮT SSL KHI DÙNG REDIS DOCKER LOCAL 
spring.data.redis.ssl.enabled=false

# Cấu hình Gửi Email qua Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cấu hình JWT Secret Key
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Google AI Studio / Cloud TTS API Key
google.ai.studio.api-key=${GOOGLE_AI_KEY}

# Stringee API Credentials
stringee.key.sid=${STRINGEE_KEY_SID}
stringee.key.secret=${STRINGEE_KEY_SECRET}
stringee.from.number=${STRINGEE_FROM_NUMBER}

# Bắt Jackson bỏ qua lỗi Proxy rỗng của Hibernate
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Khóa bí mật cho camera AI / vòng đeo IoT gọi vào
sentinel.device-api-key=${DEVICE_API_KEY:}

# Địa chỉ công khai của backend, dùng trong link email
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Origin của frontend được phép gọi API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cookie phiên đăng nhập (JWT)
app.auth.cookie-name=sentinel_access_token
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}



# ===== Thanh toán & gói dịch vụ =====
# Cổng thanh toán GIẢ LẬP: bật khi phát triển/demo, ĐẶT false khi deploy
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}

app.subscription.grace-days=3
app.subscription.reminder-days=3
app.subscription.billing-retry-hours=24
# Lịch job (giờ Việt Nam): nhắc gia hạn 09:00 mỗi ngày; thu tiền / xử lý hết hạn mỗi giờ
app.subscription.cron.reminder=0 0 9 * * *
app.subscription.cron.billing=0 0 * * * *

# Địa chỉ frontend dùng trong nút của email
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}


# ===== Thanh toán & gói dịch vụ =====
# Mã đơn gửi cổng. MoMo không cho trùng mã đơn: nếu xóa CSDL làm lại thì đổi tiền tố (vd SC2)
payment.order-prefix=${PAYMENT_ORDER_PREFIX:SC}

# Khóa mã hóa Payment Token khi lưu CSDL (AES-256). Tạo bằng:  openssl rand -base64 32
payment.token-key=${PAYMENT_TOKEN_KEY:}

# MoMo (sandbox: https://test-payment.momo.vn, production: https://payment.momo.vn)
payment.momo.base-url=${MOMO_BASE_URL:https://test-payment.momo.vn}
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.store-id=${MOMO_STORE_ID:SentinelCareStore}
payment.momo.rsa-public-key=${MOMO_RSA_PUBLIC_KEY:}
payment.momo.rsa-transformation=RSA/ECB/PKCS1Padding

# Chính sách gia hạn
billing.grace-days=3
billing.reminder-days=3
billing.retry-hours=24
billing.entitlement-slack-hours=24
billing.pending-invoice-timeout-minutes=30
# true = thu hồi token ở cổng khi người dùng hủy gia hạn (mặc định giữ token để bật lại dễ dàng)
billing.revoke-token-on-cancel=false
# Lịch job (giờ Việt Nam): thu tiền/hết hạn mỗi giờ, nhắc gia hạn 09:00, dọn hóa đơn treo mỗi 15 phút
billing.cron.renewal=0 0 * * * *
billing.cron.reminder=0 0 9 * * *
billing.cron.pending-invoices=0 */15 * * * *